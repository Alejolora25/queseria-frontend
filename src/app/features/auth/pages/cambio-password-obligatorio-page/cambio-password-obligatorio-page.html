<main class="password-page">
  <form class="password-card" [formGroup]="form" (ngSubmit)="submit()">
    <span class="eyebrow">Seguridad de la cuenta</span>
    <h1>Establece tu contraseña</h1>
    <p>Antes de continuar, reemplaza la credencial temporal por una contraseña personal.</p>

    <label for="passwordActual">Contraseña temporal</label>
    <div class="password-field">
      <input id="passwordActual" [type]="mostrarActual() ? 'text' : 'password'" autocomplete="current-password" formControlName="passwordActual" />
      <button class="visibility-toggle" type="button" [attr.aria-label]="mostrarActual() ? 'Ocultar contraseña temporal' : 'Mostrar contraseña temporal'" [attr.aria-pressed]="mostrarActual()" (click)="mostrarActual.set(!mostrarActual())">
        <i [class]="mostrarActual() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
      </button>
    </div>

    <label for="passwordNueva">Contraseña nueva</label>
    <div class="password-field">
      <input id="passwordNueva" [type]="mostrarNueva() ? 'text' : 'password'" autocomplete="new-password" formControlName="passwordNueva" />
      <button class="visibility-toggle" type="button" [attr.aria-label]="mostrarNueva() ? 'Ocultar contraseña nueva' : 'Mostrar contraseña nueva'" [attr.aria-pressed]="mostrarNueva()" (click)="mostrarNueva.set(!mostrarNueva())">
        <i [class]="mostrarNueva() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
      </button>
    </div>
    <small>Usa entre 12 y 72 caracteres, con mayúscula, minúscula, número y símbolo.</small>

    <label for="confirmacion">Confirma la contraseña nueva</label>
    <div class="password-field">
      <input id="confirmacion" [type]="mostrarConfirmacion() ? 'text' : 'password'" autocomplete="new-password" formControlName="confirmacion" />
      <button class="visibility-toggle" type="button" [attr.aria-label]="mostrarConfirmacion() ? 'Ocultar confirmación de contraseña' : 'Mostrar confirmación de contraseña'" [attr.aria-pressed]="mostrarConfirmacion()" (click)="mostrarConfirmacion.set(!mostrarConfirmacion())">
        <i [class]="mostrarConfirmacion() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
      </button>
    </div>

    @if (errorMessage(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }

    <button class="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Guardando…' : 'Guardar contraseña' }}
    </button>
    <button class="secondary" type="button" (click)="logout()">Cerrar sesión</button>
  </form>
</main>
